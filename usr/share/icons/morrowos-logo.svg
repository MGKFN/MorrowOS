<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MorrowOS">
  <title>MorrowOS</title>
  <!--
    MorrowOS mark — a sun breaking a horizon.
    Colours come from tools/dawn_palette.py; keep them in sync.
    Built from three elements so it survives scaling down to 16px:
      1. the disc (reads first, holds the warm gradient)
      2. the horizon rule (anchors it, gives the "rising" reading)
      3. two rays (drop them below ~32px — see make_icons.py)
  -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F7C479"/>
      <stop offset="55%"  stop-color="#F2A65A"/>
      <stop offset="100%" stop-color="#E8705F"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C2543F" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#E8705F" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#F2A65A" stop-opacity="1"/>
      <stop offset="82%"  stop-color="#E8705F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C2543F" stop-opacity="0"/>
    </linearGradient>
    <!-- clips the disc so only the part above the horizon is drawn -->
    <clipPath id="above">
      <rect x="0" y="0" width="256" height="158"/>
    </clipPath>
  </defs>

  <!-- rays: dropped at small sizes -->
  <g class="rays" fill="none" stroke="#F2A65A" stroke-width="11"
     stroke-linecap="round" opacity="0.85">
    <path d="M52 132 L28 132"/>
    <path d="M204 132 L228 132"/>
    <path d="M70 74 L53 57"/>
    <path d="M186 74 L203 57"/>
    <path d="M128 48 L128 26"/>
  </g>

  <!-- the disc, clipped at the horizon so it reads as rising -->
  <g clip-path="url(#above)">
    <circle cx="128" cy="140" r="62" fill="url(#sun)"/>
  </g>

  <!-- horizon -->
  <rect x="20" y="152" width="216" height="12" rx="6" fill="url(#horizon)"/>
</svg>
