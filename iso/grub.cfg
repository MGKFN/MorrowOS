# MorrowOS boot menu.
#
# The theme is loaded defensively: gfxmenu and png are insmod'ed and the
# theme file is tested before $theme is set. GRUB falling back to its plain
# text menu is a cosmetic problem; GRUB erroring out on a missing theme is
# an unbootable ISO, and the difference is these three lines.

if loadfont /boot/grub/font.pf2 ; then
    set gfxmode=auto
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
    insmod gfxterm
    insmod png
    insmod gfxmenu
    terminal_output gfxterm

    if [ -f /boot/grub/themes/morrowos/theme.txt ]; then
        set theme=/boot/grub/themes/morrowos/theme.txt
        export theme
    fi
fi

set default=0
set timeout=15
set timeout_style=menu

menuentry "MorrowOS (live)" {
    linux /casper/vmlinuz boot=casper username=morrow userfullname=Morrow hostname=morrowos quiet splash ---
    initrd /casper/initrd
}

menuentry "MorrowOS (safe graphics - nomodeset)" {
    linux /casper/vmlinuz boot=casper username=morrow userfullname=Morrow hostname=morrowos nomodeset quiet splash ---
    initrd /casper/initrd
}

menuentry "MorrowOS (verbose - show all boot messages)" {
    linux /casper/vmlinuz boot=casper username=morrow userfullname=Morrow hostname=morrowos debug ---
    initrd /casper/initrd
}

grub_platform
if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI Firmware Settings" {
        fwsetup
    }
fi
