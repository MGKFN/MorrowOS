name: Build MorrowOS ISO

# Manual trigger only — this job downloads several GB and runs for a while.
# Run it from the Actions tab: "Build MorrowOS ISO" -> "Run workflow".
#
# NOTE: this uses the workflow's built-in GITHUB_TOKEN, which GitHub creates
# fresh for each run and scopes to this repo only. You do NOT need to create
# a personal access token, and you should never paste one anywhere.

on:
  workflow_dispatch:
    inputs:
      base_iso_url:
        description: "URL of the base ISO (must be a casper live ISO with casper/filesystem.squashfs)"
        required: true
        default: "https://cdimage.ubuntu.com/kubuntu/releases/24.04/release/kubuntu-24.04.5-desktop-amd64.iso"
      version:
        description: "Release tag, e.g. v1.1"
        required: true
        default: "v1.1"
      boot_splash:
        description: "Brand the boot splash (regenerates the initrd — verified, falls back to stock on any failure)"
        type: boolean
        default: true
      publish_parts:
        description: "Also commit split 20MB parts into /morrowos (bloats the repo permanently — prefer the release asset)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free up disk space
        # A stock runner has ~14GB free. The base ISO plus the extracted
        # stage plus the uncompressed squashfs-root will blow past that.
        # Removing the preinstalled toolchains buys back ~25GB.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af || true
          sudo apt-get clean
          echo "--- after cleanup ---"
          df -h /

      - name: Preflight
        # Cheap checks that fail in seconds rather than 40 minutes in.
        run: |
          echo "--- Dawn palette contrast (make_colorscheme refuses to write if this fails) ---"
          python3 tools/dawn_palette.py
          echo
          echo "--- every source path build.sh installs ---"
          python3 tools/check_assets.py
          echo
          echo "--- boot branding assets ---"
          MISSING=0
          for f in usr/share/plymouth-morrowos/morrowos.plymouth \
                   usr/share/plymouth-morrowos/morrowos.script \
                   usr/share/plymouth-morrowos/mark.png \
                   usr/share/plymouth-morrowos/glow.png \
                   usr/share/plymouth-morrowos/wordmark.png \
                   usr/share/plymouth-morrowos/bar-track.png \
                   usr/share/plymouth-morrowos/bar-fill.png \
                   iso/grub-theme/theme.txt \
                   iso/grub-theme/background.png \
                   scripts/boot-splash.sh \
                   scripts/installer-branding.sh \
                   etc/calamares/branding/morrowos/branding.desc \
                   etc/calamares/branding/morrowos/show.qml \
                   etc/calamares/branding/morrowos/logo.png \
                   etc/calamares/branding/morrowos/welcome.png; do
            if [ -e "$f" ]; then echo "  ok      $f"
            else echo "  MISSING $f"; MISSING=1; fi
          done
          # Rectangle() is not a real Plymouth primitive. A theme that calls it
          # aborts silently at boot, which is how v1.0-v1.2 shipped.
          if grep -vE '^\s*#' usr/share/plymouth-morrowos/morrowos.script | grep -q 'Rectangle'; then
            echo "!! morrowos.script calls Rectangle(), which does not exist in Plymouth's script module."
            MISSING=1
          fi
          bash -n scripts/boot-splash.sh || MISSING=1
          bash -n scripts/installer-branding.sh || MISSING=1

          echo
          echo "--- calamares installer branding ---"
          python3 tools/check_installer_branding.py || MISSING=1

          exit $MISSING

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            squashfs-tools xorriso isolinux syslinux-common rsync

      - name: Download base ISO
        run: |
          curl -L --retry 3 --retry-delay 5 -o ubuntu-base.iso \
            "${{ inputs.base_iso_url }}"
          ls -lh ubuntu-base.iso
          # A 404 page is a few hundred bytes and curl -L happily saves it.
          SIZE=$(stat -c%s ubuntu-base.iso)
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "!! Downloaded only $SIZE bytes — that is not an ISO."
            echo "   The URL is probably wrong or the file moved. First 2000 bytes:"
            head -c 2000 ubuntu-base.iso
            echo
            echo "   cdimage only keeps the CURRENT point release, so a bare"
            echo "   '24.04' filename will 404 — check what is actually at"
            echo "   https://cdimage.ubuntu.com/kubuntu/releases/24.04/release/"
            exit 1
          fi
          # Confirm it's the layout build.sh expects before burning an hour on it
          xorriso -indev ubuntu-base.iso -find /casper -name 'filesystem.squashfs' 2>&1 \
            | grep -q filesystem.squashfs \
            || { echo "!! Base ISO has no casper/filesystem.squashfs."; \
                 echo "   Ubuntu Desktop 24.04 uses layered squashfs files instead."; \
                 echo "   Use a Kubuntu 24.04 ISO, or adapt build.sh step 2."; exit 1; }

      - name: Build ISO
        env:
          DEBIAN_FRONTEND: noninteractive
          ISO_OUT: morrowos-${{ inputs.version }}.iso
          MORROW_BOOT_SPLASH: ${{ inputs.boot_splash && '1' || '0' }}
        run: |
          # pipefail matters: without it `tee` masks a failed build.sh.
          set -o pipefail
          chmod +x build.sh scripts/boot-splash.sh
          sudo -E bash build.sh ubuntu-base.iso 2>&1 | tee build.log

      - name: Boot branding result
        if: always()
        # The splash step is designed to degrade rather than fail, so its
        # outcome has to be reported explicitly -- otherwise a fallback to the
        # stock splash looks exactly like a success in the log.
        run: |
          touch build.log
          {
            echo "## Boot branding"
            echo
            if grep -q "boot splash: APPLIED" build.log; then
              echo "**Splash: MorrowOS.** The initrd was regenerated and verified."
              echo
              echo '```'
              grep -E "casper scripts:|overlay/squashfs/loop|morrowos theme files|default plymouth theme|kernel:|new initrd:|base initrd:" build.log || true
              echo '```'
            elif grep -q "MORROW_BOOT_SPLASH=0\|skipped (MORROW_BOOT_SPLASH" build.log; then
              echo "**Splash: stock** — skipped, boot_splash was off for this run."
            else
              echo "**Splash: stock** — the branding step bailed out and restored the base initrd."
              echo "The ISO still boots. Reason:"
              echo
              echo '```'
              grep -E "^!!|boot splash NOT applied" build.log | head -10 || echo "(no reason recorded)"
              echo '```'
            fi
            echo
            if grep -q "Boot menu:   MorrowOS Dawn theme" build.log; then
              echo "**Menu: MorrowOS Dawn theme.**"
            else
              echo "**Menu: stock** — the GRUB theme was not installed."
            fi
            echo
            if grep -q "installer branding: APPLIED" build.log; then
              echo "**Installer: MorrowOS-branded.** It installs to disk as MorrowOS."
              grep -E "unpackfs source|branding files:|settings.conf branding|launcher branded" build.log \
                | sed 's/^/    /' || true
            else
              echo "**Installer: stock** — it will say Kubuntu. Reason:"
              echo
              echo '```'
              grep -E "installer branding NOT applied" build.log | head -5 || echo "(no reason recorded)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Checksum
        id: sum
        run: |
          ISO="morrowos-${{ inputs.version }}.iso"
          sha256sum "$ISO" | tee "$ISO.sha256"
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO"

      - name: Reclaim space before upload
        run: |
          rm -f ubuntu-base.iso
          sudo rm -rf /tmp/morrowos-build
          df -h /

      - name: Stage release assets
        id: stage
        # GitHub rejects any single release asset over 2 GiB (2147483648 B).
        # Split anything larger into parts that stay under it. Parts are
        # named .partNN with numeric suffixes, so `cat ...part*` reassembles
        # them in the right order without any sorting.
        run: |
          ISO="${{ steps.sum.outputs.iso }}"
          LIMIT=2147483648
          SIZE=$(stat -c%s "$ISO")
          mkdir -p release
          cp "$ISO.sha256" release/

          if [ "$SIZE" -lt "$LIMIT" ]; then
            echo "ISO is $SIZE bytes — under the cap, uploading whole."
            mv "$ISO" release/
            echo "split=false" >> "$GITHUB_OUTPUT"
          else
            echo "ISO is $SIZE bytes — over the 2 GiB cap, splitting."
            # 1900M (MiB) = 1992294400 B, comfortably under the cap
            split -b 1900M -d "$ISO" "release/$ISO.part"
            rm -f "$ISO"
            echo "split=true" >> "$GITHUB_OUTPUT"
          fi
          ls -lh release/

      - name: Write release notes
        run: |
          ISO="${{ steps.sum.outputs.iso }}"
          {
            echo "Automated build. BIOS + UEFI, 64-bit."
            echo
            if grep -q "boot splash: APPLIED" build.log 2>/dev/null; then
              echo "Boot splash: MorrowOS Dawn."
            else
              echo "Boot splash: stock (the branding step fell back — see the run log)."
            fi
            grep -q "Boot menu:   MorrowOS Dawn theme" build.log 2>/dev/null \
              && echo "Boot menu: MorrowOS Dawn theme."
            if grep -q "installer branding: APPLIED" build.log 2>/dev/null; then
              echo "Installer: installs to disk as MorrowOS."
            else
              echo "Installer: stock (unbranded — see the run log)."
            fi
            echo
            echo '**SHA256 of the assembled ISO:**'
            echo '```'
            cat "release/$ISO.sha256"
            echo '```'
            echo
            if [ "${{ steps.stage.outputs.split }}" = "true" ]; then
              echo "The ISO exceeds GitHub's 2 GiB per-asset limit, so it is"
              echo "published as numbered parts. Download every \`.part*\` file"
              echo "into one folder, then reassemble:"
              echo
              echo '**Linux / macOS**'
              echo '```bash'
              echo "cat $ISO.part* > $ISO"
              echo "sha256sum -c $ISO.sha256"
              echo '```'
              echo
              echo '**Windows — simplest (Command Prompt, in the folder with the parts)**'
              echo '```'
              printf 'copy /b '
              FIRST=1
              for f in release/$ISO.part*; do
                [ "$FIRST" = 1 ] || printf '+ '
                printf '%s ' "$(basename "$f")"
                FIRST=0
              done
              printf '%s\n' "$ISO"
              echo '```'
              echo
              echo "Then check it in PowerShell:"
              echo '```powershell'
              echo "(Get-FileHash \"$ISO\" -Algorithm SHA256).Hash.ToLower()"
              echo '```'
              echo
              echo '**Windows — PowerShell alternative**'
              echo
              echo 'Three things here are deliberate and were each a real bug:'
              echo '`Join-Path $PWD.Path` because .NET APIs resolve relative paths'
              echo "against the process working directory, NOT PowerShell's location;"
              echo '`File::Create` rather than `OpenWrite` because OpenWrite does not'
              echo 'truncate, so re-running over an existing file leaves trailing bytes'
              echo 'and a wrong hash; and `CopyTo` rather than `ReadAllBytes` because'
              echo 'a 1900 MiB part read whole sits right at the ~2 GB .NET array limit.'
              echo '```powershell'
              echo "\$dir = \$PWD.Path"
              echo "\$iso = Join-Path \$dir \"$ISO\""
              echo "\$out = [System.IO.File]::Create(\$iso)"
              echo "Get-ChildItem (Join-Path \$dir \"$ISO.part*\") | Sort-Object Name | ForEach-Object {"
              echo "    \$in = [System.IO.File]::OpenRead(\$_.FullName)"
              echo "    \$in.CopyTo(\$out)"
              echo "    \$in.Close()"
              echo "}"
              echo "\$out.Close()"
              echo "(Get-FileHash \$iso -Algorithm SHA256).Hash.ToLower()"
              echo '```'
              echo
              echo "Compare that hash against the one above before booting it."
            fi
            echo
            echo "See the README for the full change list and known gaps."
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent: a re-run after a partial failure uploads into the
        # existing release instead of erroring out on "already exists".
        run: |
          VER="${{ inputs.version }}"
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "Release $VER exists — uploading assets into it."
            gh release upload "$VER" release/* --clobber
            gh release edit "$VER" --notes-file release-notes.md
          else
            gh release create "$VER" release/* \
              --title "MorrowOS $VER" \
              --notes-file release-notes.md
          fi

      - name: Split and commit parts
        if: ${{ inputs.publish_parts }}
        run: |
          echo "publish_parts is on, but the ISO has already been moved into"
          echo "release/ and published as release assets. Committing hundreds"
          echo "of MB to git bloats the repo permanently — use the release."
          exit 1
